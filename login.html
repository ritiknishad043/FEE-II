<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
      background-image: url("stars-galaxy-3840x2160-10307.jpg");
      background-attachment: fixed;
    }
    #box{
      height: 100vh;
      width: 100vw;
      /* margin: 120px auto; */
      background-color: aqua;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }
    .login {
      background-color: aquamarine;
      padding: 30px;
      border-radius: 30px;
      width: 300px;
      text-align: center;
    }
    .password-box{
      position: relative;
    }
    input {
      width: 280px;
      padding: 10px;
      margin-top: 20px;
      margin-bottom: 20px;
      border-radius: 30px;
    }
    .heart{
      position: relative;
      bottom: 51px;
      left:130px;
    }
    .hidden{
      display: none;
      background-color: gray;
      border-radius: 30px;
      padding: 5px;
      position: absolute;
      bottom: 28px;
      right: 140px;
      width: 300px;
      
    }
    .heart:hover{
      .hidden{
        display: inline;
      }
    }

    </style>
</head>
<body>
    <div id="box">
      <div class="login">
        <form id="loginForm">
          <input id="loginEmail" type="email" placeholder="Email">
          <div class="password-box">
            <input type="password" placeholder="Password">
            <div class="heart">
              🖤
              <span class="hidden">Password should be at least 8 characters</span>
            </div>
          </div>
        </form>
      </div>
    </div>
</body>
</html>
