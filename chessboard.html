<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <style>
        .board{

            width: 400px;
            display: grid;
            border: 2px black solid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(4,1fr);
        }
        .box{
            background-color: black;
        }
    </style>
</head>

        <div class="wbox"></div>

        <div class="box"></div>

        <div class="wbox"></div>

        <div class="wbox"></div>

        <div class="wbox"></div>
        <div class="box"></div>
        <div class="wbox"></div>
        
    </div>
</body>
</html>
