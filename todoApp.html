<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            display:flex;
            justify-content:center;
            margin-top:50px;
            background:#f2f2f2;
        }

        #todo{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        input{
            padding:8px;
            width:220px;
            font-size:16px;
            margin-right:10px;
        }

        button{
            padding:8px 12px;
            margin:2px;
            cursor:pointer;
        }

        #taskList{
            margin-top:20px;
            width:500px;
            min-height:300px;
            border:2px solid black;
            border-radius:10px;
            padding:10px;
            background:white;
        }

        .todoItem{
            display:flex;
            justify-content:space-between;
            align-items:center;
            border:1px solid gray;
            padding:10px;
            margin-bottom:10px;
            border-radius:8px;
            background:#fafafa;
        }

        .completed{
            background:lightgreen;
        }

        .buttons button{
            margin-left:5px;
        }
    </style>
</head>
<body>

<div id="todo"></div>

<script src="todo.js"></script>

</body>
</html>
